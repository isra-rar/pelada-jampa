services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pelada
      POSTGRES_PASSWORD: pelada
      POSTGRES_DB: pelada
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pelada"]
      interval: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      PELADA_ENVIRONMENT: development
      PELADA_DATABASE_URL: postgresql+psycopg://pelada:pelada@db:5432/pelada
      PELADA_JWT_SECRET: ${PELADA_JWT_SECRET:-troque-este-segredo}
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media  # fotos de perfil; sobrevivem a novos deploys

volumes:
  pgdata:
  media:
