name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pelada
          POSTGRES_PASSWORD: pelada
          POSTGRES_DB: pelada
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pelada"
          --health-interval 5s
          --health-retries 10
    env:
      PELADA_DATABASE_URL: postgresql+psycopg://pelada:pelada@localhost:5432/pelada
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      # migrações sobem, descem e batem com os modelos
      - run: alembic upgrade head && alembic check && alembic downgrade base && alembic upgrade head
      # os testes rodam no Postgres: travas (FOR UPDATE) e tipos se comportam diferente do SQLite
      - name: pytest (Postgres)
        run: |
          PGPASSWORD=pelada psql -h localhost -U pelada -c "CREATE DATABASE pelada_test"
          PELADA_TEST_DATABASE_URL=postgresql+psycopg://pelada:pelada@localhost:5432/pelada_test pytest -p no:warnings
      - name: pytest (SQLite)
        run: pytest -p no:warnings
